[project]
name = 'georead'
version = "0.0.1"
dependencies = [
    'pandas',
    'numpy',
    'chardet',
    'h5py'
]
requires-python =">=3.11"
[project.optional-dependencies]
test = [
    'pytest'
]

[tool.setuptools.packages.find]
include = ["georead", "georead.*"]

[tool.ruff]
exclude = ["docs/*"]
[tool.ruff.lint]
extend-select = [
    'D'
]
ignore = [
    'D203',
    'D212'
]
[tool.ruff.format]
quote-style = 'single'

[tool.basedpyright]
exclude = ["docs/*"]

[tool.setuptools.package-data]
'georead' = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    'georead[test]',
    'ruff',
    'pandas-stubs>=2.3.3',
    'basedpyright',
    'pre-commit',
    "jupyterlab>=4.5.0",
    "ipdb>=0.13.13",
]
