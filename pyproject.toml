[project]
name = 'resdp'
version = "0.0.1"
dependencies = [
    'pandas',
    'numpy',
    'chardet'
]
requires-python =">=3.11"
[project.optional-dependencies]
dev = [
    'pytest',
    'ruff',
    'pandas-stubs',
    'basedpyright'
    ]
[tool.ruff]
[tool.ruff.lint]
extend-select = [
    'D'
]
ignore = [
    'D203',
    'D212'
]
[tool.ruff.format]
quote-style = 'single'
