[project]
name = 'resdp'
version = "0.0.1"
dependencies = [
    'pandas',
    'numpy',
    'chardet'
]
requires-python =">=3.11"
[project.optional-dependencies]
test = [
    'pytest'
]
[tool.ruff]
[tool.ruff.lint]
extend-select = [
    'D'
]
ignore = [
    'D203',
    'D212'
]
[tool.ruff.format]
quote-style = 'single'

[tool.setuptools.package-data]
'resdp' = ["py.typed"]

[dependency-groups]
dev = [
    'resdp[test]',
    'ruff',
    'pandas-stubs',
    'basedpyright',
    'pre-commit',
    "jupyterlab>=4.5.0",
    "ipdb>=0.13.13",
]
